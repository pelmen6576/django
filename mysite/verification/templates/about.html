
{%extends "template.html"%}

<html>

{%block body%}

    <div id="head">
        <p id="head-p">{{nickname}}</p>
        <a href="/about"><button id="head-button">домой</button></a>
        <a href="/about/create_question"><button id="head-button">задать вопрос</button></a>
        <a href="/about/my_questions"><button id="head-button">мои вопросы</button></a>
        <form style='display: inline;', method="post">
            {% csrf_token %}
            <button type="submit"  id="head-button">выход</button>
        </form>
        
        
    </div>
    {%if len == 0 %}
        <P id="no_answer_text"></style>нет ваших вопросов:(</P>
    {%else%}
    {%for i in questions%}
    <a href="/about/question?id={{i.id}}"><button id="question_box">
        <p id="question_text" style="font-weight: 900;">{{i.id_persons.nickname}}</p>
        <p id="question_text">{{i.questions}}</p>
        <p id="date">{{i.date}}</p>
    </button></a>
    {%endfor%}
    {%endif%}

{%endblock body%}
</html>
